<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DESCO Customer Portal</title>
  <meta name="description" content="View, download and pay your DESCO electricity bills.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/tailwind.config.js"></script>
</head>

<body class="min-h-screen bg-paper font-sans text-ink antialiased">
  <a href="#view" class="sr-only z-[80] rounded-md bg-brand px-3 py-2 text-white focus:not-sr-only focus:fixed focus:left-3 focus:top-3">Skip to content</a>

  <!-- Sign-in renders here when there is no session -->
  <div id="auth-root"></div>

  <div id="shell" hidden>
    <header class="sticky top-0 z-30 border-b border-line bg-surface/90 backdrop-blur-md">
      <div class="mx-auto flex h-16 max-w-6xl items-center gap-2 px-4 sm:px-6">
        <a href="#/dashboard" class="flex shrink-0 items-center gap-3" aria-label="DESCO">
          <img src="assets/img/logo-desco.svg" alt="DESCO — Power is yours" class="h-6 w-auto sm:h-7">
          <span class="hidden h-7 w-px bg-line sm:block"></span>
          <span class="hidden text-[13px] font-semibold sm:block" data-t="Customer Portal">Customer Portal</span>
        </a>
        <nav id="topnav" class="ml-6 hidden items-center gap-1 md:flex" aria-label="Main"></nav>
        <div class="ml-auto flex items-center gap-2">
          <div class="seg" role="group" aria-label="Language / ভাষা">
            <button data-lang="en" lang="en">EN</button>
            <button data-lang="bn" lang="bn" class="font-bn">বাংলা</button>
          </div>
          <div id="user-menu" class="relative"></div>
        </div>
      </div>
      <nav id="tabnav" class="mx-auto grid max-w-6xl grid-cols-2 gap-1 px-4 pb-2 md:hidden" aria-label="Main"></nav>
    </header>

    <main id="view" tabindex="-1" class="outline-none"></main>

    <footer class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 border-t border-line px-4 py-6 text-xs text-ink-3 sm:px-6">
      <span data-t="© Dhaka Electricity Supply PLC · Hotline <b class='num text-ink-2'>16120</b>">© Dhaka Electricity Supply PLC · Hotline <b class="num text-ink-2">16120</b></span>
      <span class="flex items-center gap-2"><span data-icon="shield" class="h-3.5 w-3.5 text-ok"></span><span data-t="DESCO never asks for your OTP or PIN.">DESCO never asks for your OTP or PIN.</span></span>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="pointer-events-none fixed bottom-4 right-4 z-[60] flex w-[min(24rem,calc(100vw-2rem))] flex-col gap-2" aria-live="polite"></div>
  <div id="tooltip" class="rounded-md bg-brand-950 px-2.5 py-1.5 text-xs text-white shadow-pop"></div>
  <div id="print-root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/views/login.js"></script>
  <script src="assets/js/views/dashboard.js"></script>
  <script src="assets/js/views/bills.js"></script>
  <script src="assets/js/views/bill-viewer.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
